#cloud-config
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - jq
  - openssh-server
  - openssl
  - python3-yaml
  - rsync
  - snapd
  - docker.io
  - docker-compose-v2
  - docker-buildx

users:
  - default
  - name: agent
    gecos: Automation Agent
    shell: /bin/bash
    lock_passwd: false
    passwd: ${agent_password_hash}
    sudo: "ALL=(ALL) NOPASSWD: /snap/bin/microk8s, /usr/bin/systemctl"

write_files:
  - path: /etc/ssh/sshd_config.d/00-alfresco-poc.conf
    owner: root:root
    permissions: '0644'
    content: |
      PasswordAuthentication yes
      PermitRootLogin prohibit-password
  - path: /etc/alfresco-poc.env
    owner: root:root
    permissions: '0644'
    content: |
      NODE_IP='${node_ip}'
      API_ADDRESS='192.168.50.100'
      MICROK8S_CHANNEL='1.35/stable'
      POC_NAMESPACE='alfresco-poc'
      BOOTSTRAP_REVISION='${bootstrap_revision}'
  - path: /usr/local/sbin/alfresco-poc-bootstrap
    owner: root:root
    permissions: '0755'
    encoding: b64
    content: ${bootstrap_script_base64}
  - path: /usr/local/bin/alfresco-poc-verify
    owner: root:root
    permissions: '0755'
    encoding: b64
    content: ${verify_script_base64}

runcmd:
  - [bash, -c, 'set -euo pipefail; /usr/local/sbin/alfresco-poc-bootstrap']
