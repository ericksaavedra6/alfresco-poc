#cloud-config
package_update: true
package_upgrade: false
packages:
  - curl
  - apt-transport-https
  - ca-certificates
  - snapd

runcmd:
  - echo "=== Inicializando entorno para PoC de Alfresco ==="
  - "[ -e /dev/kmsg ] || ln -s /dev/console /dev/kmsg"
  - echo "=== Esperando a que snapd esté activo ==="
  - snap wait system seed
  - echo "=== Instalando MicroK8s ==="
  - snap install microk8s --classic
  - echo "=== Esperando a que MicroK8s esté listo por primera vez ==="
  - /snap/bin/microk8s status --wait-ready
  - echo "=== Sincronizando certificados persistidos de MicroK8s ==="
  - /snap/bin/microk8s stop
  - mkdir -p /mnt/microk8s-certs /var/snap/microk8s/current/certs
  - if [ -f /mnt/microk8s-certs/ca.crt ] && [ -f /mnt/microk8s-certs/ca.key ]; then echo "Restaurando certificados..."; cp -a /mnt/microk8s-certs/. /var/snap/microk8s/current/certs/; else echo "Respaldando certificados iniciales..."; cp -a /var/snap/microk8s/current/certs/. /mnt/microk8s-certs/; fi
  - echo "=== Configurando la IP del nodo preventivamente ==="
  - NODE_IP=$(ip -4 addr show eth0 | grep -oP '(?<=inet\s)\d+(\.\d+){3}')
  - mkdir -p /var/snap/microk8s/current/args
  - echo "--node-ip=$${NODE_IP}" >> /var/snap/microk8s/current/args/kubelet
  - echo "=== Agregando 192.168.50.100 a [ alt_names ] para acceso remoto TLS ==="
  - grep -q "192.168.50.100" /var/snap/microk8s/current/certs/csr.conf.template || sed -i '/^IP\.2 = 10\.152\.183\.1/a IP.3 = 192.168.50.100' /var/snap/microk8s/current/certs/csr.conf.template
  - echo "=== Forzando plataforma por defecto en containerd ==="
  - sed -i 's/platforms = \[\]/platforms = \["linux\/amd64"\]/g' /var/snap/microk8s/current/args/containerd-template.toml 2>/dev/null || true
  - echo "=== Arrancando MicroK8s y refrescando certificado del servidor ==="
  - /snap/bin/microk8s start
  - /snap/bin/microk8s status --wait-ready
  - /snap/bin/microk8s refresh-certs --cert server.crt
  - /snap/bin/microk8s status --wait-ready
  - cp -a /var/snap/microk8s/current/certs/. /mnt/microk8s-certs/
  - echo "=== Configurando alias global para kubectl ==="
  - echo "alias kubectl='microk8s kubectl'" >> /root/.bashrc
  - echo "Aprovisionamiento integral finalizado."